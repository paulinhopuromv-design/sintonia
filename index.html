<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sintonia — player de IPTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F7; --bg2:#E4E9F3; --surface:#FFFFFF; --surface2:#F4F6FB; --line:#D6DCE9;
  --text:#141A2B; --muted:#5A6380; --accent:#B86A00; --accent-ink:#FFFFFF; --accent-soft:rgba(184,106,0,.12);
  --live:#D92139; --ok:#16875A; --shadow:0 12px 30px rgba(20,26,43,.12);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-sm:8px; --r-md:14px; --r-lg:22px;
  --rail:88px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1322; --bg2:#111a2e; --surface:#172038; --surface2:#1E2945; --line:#283454;
    --text:#ECEFF7; --muted:#8D97B4; --accent:#FFB547; --accent-ink:#231400; --accent-soft:rgba(255,181,71,.14);
    --live:#FF4D5E; --ok:#3CCB8D; --shadow:0 18px 40px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1322; --bg2:#111a2e; --surface:#172038; --surface2:#1E2945; --line:#283454;
  --text:#ECEFF7; --muted:#8D97B4; --accent:#FFB547; --accent-ink:#231400; --accent-soft:rgba(255,181,71,.14);
  --live:#FF4D5E; --ok:#3CCB8D; --shadow:0 18px 40px rgba(0,0,0,.45); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img{max-width:100%}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus{outline:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Shell */
#app{display:flex;height:100%}
.rail{width:var(--rail);flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:18px;color:var(--accent)}
.brand svg{width:34px;height:34px}
.brand b{font-family:var(--display);font-size:13px;color:var(--text);letter-spacing:.01em}
.nav{display:flex;flex-direction:column;align-items:center;gap:2px;width:72px;padding:10px 0;border-radius:var(--r-md);color:var(--muted);font-size:12px;font-weight:600}
.nav:hover{color:var(--text);background:var(--surface2)}
.nav.on{color:var(--accent);background:var(--accent-soft)}
.rail .spacer{flex:1}
main{flex:1;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;position:relative}
.view{padding:28px 36px 60px;max-width:1500px}

/* Type */
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;letter-spacing:-.01em}
h1{font-size:clamp(30px,4vw,46px);font-weight:800}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head p{margin:6px 0 0;color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;font-weight:700;background:var(--surface2);border:1px solid var(--line);white-space:nowrap;transition:transform .12s, background .12s}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn.icon{width:46px;padding:0}
.btn:focus-visible{transform:scale(1.04)}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .n{opacity:.6;font-weight:500}

/* Fields */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:600;color:var(--muted)}
.input{height:50px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);padding:0 14px;width:100%}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.input{appearance:auto}

/* Onboarding */
.onb{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0}
.onb-art{position:relative;overflow:hidden;background:#0B1020;color:#ECEFF7;display:flex;flex-direction:column;justify-content:space-between;padding:44px}
.onb-art canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.onb-art .top,.onb-art .bottom{position:relative}
.onb-art .word{font-family:var(--display);font-weight:800;font-size:clamp(56px,8vw,120px);line-height:.9;letter-spacing:-.03em}
.onb-art .word span{display:block;color:#FFB547}
.onb-art p{max-width:30em;color:#C5CCE0;font-size:18px;margin:18px 0 0}
.onb-form{padding:44px clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:center;max-width:620px}
.tabs{display:flex;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px;margin:22px 0}
.tab{flex:1;height:40px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.drop{border:2px dashed var(--line);border-radius:var(--r-md);padding:28px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.legal{font-size:13px;color:var(--muted);margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.err{background:color-mix(in srgb,var(--live) 12%,transparent);color:var(--text);border:1px solid color-mix(in srgb,var(--live) 40%,transparent);padding:12px 14px;border-radius:var(--r-sm);font-size:14px;margin-bottom:14px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* Loading */
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:60;flex-direction:column;gap:18px}
.bars{display:flex;gap:5px;height:44px;align-items:flex-end}
.bars i{width:9px;border-radius:3px;animation:bar 1s ease-in-out infinite}
.bars i:nth-child(1){background:#F5F5F5;animation-delay:0s}.bars i:nth-child(2){background:#F5D547;animation-delay:.1s}.bars i:nth-child(3){background:#4FD3E8;animation-delay:.2s}.bars i:nth-child(4){background:#53D769;animation-delay:.3s}.bars i:nth-child(5){background:#E055D8;animation-delay:.4s}.bars i:nth-child(6){background:#F04848;animation-delay:.5s}.bars i:nth-child(7){background:#3E5BF0;animation-delay:.6s}
@keyframes bar{0%,100%{height:12px}50%{height:44px}}

/* Home */
.hero{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#0B1020;color:#ECEFF7;min-height:300px;display:grid;grid-template-columns:auto 1fr;align-items:end;gap:28px;padding:34px;margin-bottom:34px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,16,32,.92) 30%,rgba(11,16,32,.25))}
.hero>*{position:relative;z-index:1}
.chnum{font-family:var(--display);font-weight:800;font-size:clamp(96px,14vw,180px);line-height:.78;color:#FFB547;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.hero .meta{display:flex;flex-direction:column;gap:10px;max-width:640px}
.hero h1{font-size:clamp(28px,3.6vw,44px)}
.hero p{margin:0;color:#C5CCE0}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.hero .btn:not(.primary){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.live-dot{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--live)}
.live-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 25%,transparent)}
.shelf{margin-bottom:34px}
.shelf .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.track{display:flex;gap:16px;overflow-x:auto;padding:6px 4px 14px;margin:0 -4px;scroll-snap-type:x proximity}
.track::-webkit-scrollbar{height:6px}.track::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* Cards */
.ccard{flex:none;width:210px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;scroll-snap-align:start;transition:transform .14s}
.ccard:hover,.ccard:focus-visible{transform:translateY(-3px)}
.ccard .top{display:flex;align-items:center;gap:10px}
.ccard .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:44px;height:44px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:#fff;overflow:hidden;background:#334}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px}
.poster{flex:none;width:160px;text-align:left;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;border-radius:var(--r-md);transition:transform .14s}
.poster .art{aspect-ratio:2/3;border-radius:var(--r-md);overflow:hidden;position:relative;background:var(--surface2);display:flex;align-items:flex-end;padding:12px;color:#fff;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05;box-shadow:var(--shadow)}
.poster .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .art .prog{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.3)}
.poster .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poster .s{font-size:13px;color:var(--muted);margin-top:-6px}
.poster:hover,.poster:focus-visible{transform:scale(1.04)}
.poster:focus-visible{outline:none}
.poster:focus-visible .art{outline:3px solid var(--accent);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.grid .poster{width:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.empty{border:1px dashed var(--line);border-radius:var(--r-lg);padding:40px;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:6px}

/* Live */
.live{display:grid;grid-template-columns:230px minmax(0,1fr) 360px;gap:20px;height:calc(100vh - 140px);min-height:480px}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.pane .ph{padding:14px;border-bottom:1px solid var(--line)}
.scroll{overflow-y:auto;flex:1;min-height:0;padding:6px}
.cat{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:11px 12px;border-radius:10px;text-align:left;font-weight:600;font-size:15px}
.cat span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .n{color:var(--muted);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.cat:hover{background:var(--surface2)}
.cat.on{background:var(--accent-soft);color:var(--accent)}
.ch{display:grid;grid-template-columns:44px 44px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:12px;text-align:left}
.ch:hover{background:var(--surface2)}
.ch:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.ch.sel{background:var(--surface2)}
.ch .num{font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;font-size:15px}
.ch .info{min-width:0}
.ch .nm,.ch .now{display:block}
.ch .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .now{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .prog{margin-top:5px;height:3px}
.ch .fav{color:var(--accent)}
.ch .fav svg{width:18px;height:18px;fill:currentColor}
.pv{padding:20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.pv .screen{aspect-ratio:16/9;border-radius:var(--r-md);overflow:hidden;background:#0B1020;position:relative}
.pv .screen canvas{width:100%;height:100%;display:block}
.pv .screen .logo{position:absolute;left:12px;top:12px}
.epg{display:flex;flex-direction:column;gap:2px}
.prg{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:10px;border-radius:10px}
.prg.now{background:var(--accent-soft)}
.prg time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;font-weight:600}
.prg .t{font-weight:600;font-size:15px}
.prg .d{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.search-in{position:relative}
.search-in svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search-in .input{padding-left:38px;height:42px;border-radius:999px}

/* Settings */
.set{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.card h3{margin-bottom:4px}
.card>p{margin:0 0 16px;color:var(--muted);font-size:14px}
.rowx{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rowx:first-of-type{border-top:0}
.rowx .k{font-weight:600}
.rowx .v{color:var(--muted);font-size:14px;text-align:right}
.pl{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:10px}
.pl.on{border-color:var(--accent);background:var(--accent-soft)}
.pl .grow{flex:1;min-width:0}
.pl .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.06em;color:var(--accent)}
.switch{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{height:32px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--bg)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.keys kbd{font-family:var(--body);font-weight:700;background:var(--surface2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 8px;font-size:13px;white-space:nowrap}

/* Modal */
.modal{position:fixed;inset:0;z-index:70;background:rgba(6,9,18,.62);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:var(--surface);border-radius:var(--r-lg);width:min(880px,100%);max-height:calc(100% - 20px);overflow-y:auto;box-shadow:var(--shadow);border:1px solid var(--line);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
.detail{display:grid;grid-template-columns:240px 1fr;gap:28px;padding:28px}
.detail .poster{width:100%}
.detail .poster:hover{transform:none}
.detail h2{font-size:30px;font-weight:800}
.facts{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:10px 0 14px}
.facts b{color:var(--text)}
.plot{margin:0 0 20px;max-width:60ch}
.eps{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.ep{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;text-align:left;border:1px solid var(--line)}
.ep:hover{background:var(--surface2)}
.ep .n{font-family:var(--display);font-weight:800;color:var(--muted);font-size:18px}
.ep .prog{margin-top:6px}
.pin{padding:30px;text-align:center;width:min(380px,100%)}
.pin .dots{display:flex;justify-content:center;gap:14px;margin:20px 0}
.pin .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pin .dots i.f{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:58px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-family:var(--display);font-size:22px;font-weight:700}
.pad button:focus-visible{background:var(--accent);color:var(--accent-ink)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:pop .2s ease-out;max-width:90vw}

/* Player */
.player{position:fixed;inset:0;z-index:80;background:#000;color:#fff;overflow:hidden}
.player video,.player canvas.demo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.player .ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .25s;background:linear-gradient(180deg,rgba(0,0,0,.65),transparent 22%,transparent 60%,rgba(0,0,0,.85))}
.player.idle .ui{opacity:0;pointer-events:none}
.player.idle{cursor:none}
.p-top{display:flex;align-items:center;gap:14px;padding:calc(18px + env(safe-area-inset-top,0px)) 24px 0}
.p-top .ttl{flex:1;min-width:0}
.p-top .ttl b{display:block;font-family:var(--display);font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-top .ttl span{color:#C5CCE0;font-size:14px}
.pbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.08);flex:none;transition:background .12s,transform .12s}
.pbtn:hover{background:rgba(255,255,255,.18)}
.pbtn:focus-visible{background:#FFB547;color:#231400;outline:none;transform:scale(1.08)}
.pbtn.big{width:66px;height:66px}
.pbtn.big svg{width:30px;height:30px}
.pbtn.on{color:#FFB547}
.pbtn.on svg{fill:currentColor}
.p-bottom{padding:0 24px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.p-now{display:flex;flex-direction:column;gap:6px;max-width:720px}
.p-now .t{font-weight:700;font-size:18px}
.p-now .nx{color:#C5CCE0;font-size:14px}
.p-now .prog{background:rgba(255,255,255,.25);height:4px}
.p-now .prog i{background:#FFB547}

function demoEpg(item) {

/* ========= M3U ========= */
function parseM3U(text) {
  const lines = text.split(/\r?\n/); const header = {}; const out = []; let cur = null;
  const attrs = (s) => { const o = {}; s.replace(/([\w-]+)="([^"]*)"/g, (_, k, v) => { o[k.toLowerCase()] = v; }); return o; };
  for (let raw of lines) {
    const l = raw.trim(); if (!l) continue;
    if (l.startsWith('#EXTM3U')) { Object.assign(header, attrs(l)); continue; }
    if (l.startsWith('#EXTINF')) {
      let q = false, cut = -1;
      for (let i = 8; i < l.length; i++) { const c = l[i]; if (c === '"') q = !q; else if (c === ',' && !q) { cut = i; break; } }
      cur = { a: attrs(cut > 0 ? l.slice(0, cut) : l), name: cut > 0 ? l.slice(cut + 1).trim() : '' };
      continue;
    }
    if (l.startsWith('#EXTGRP:')) { if (cur) cur.grp = l.slice(8).trim(); continue; }
    if (l.startsWith('#')) continue;
    if (cur) { cur.url = l; out.push(cur); cur = null; }
  }
  return { header, entries: out };
}
function fromM3U(text) {
  const { header, entries } = parseM3U(text);
  if (!entries.length) throw new Error('Não encontramos canais nesse arquivo. Confira se é uma lista M3U válida.');
  const live = [], vod = [], seriesMap = new Map();
  const SE = /^(.*?)[\s\-_.|:]*S(\d{1,2})\s*[ .-]?E(\d{1,3})/i;
  let n = 0;
  for (const e of entries) {
    const name = e.a['tvg-name'] && !e.name ? e.a['tvg-name'] : (e.name || e.a['tvg-name'] || 'Sem nome');
    const cat = e.a['group-title'] || e.grp || 'Sem categoria';
    const logo = e.a['tvg-logo'] || '';
    const url = e.url; const id = String(++n);
    const isFile = /\.(mp4|mkv|avi|mov|m4v|webm)(\?|$)/i.test(url);
    const m = name.match(SE);
    if (/\/series\//i.test(url) || (m && (isFile || /s[ée]rie/i.test(cat)))) {
      const sname = (m ? m[1] : name).trim() || name; const key = cat + '|' + sname;
      if (!seriesMap.has(key)) seriesMap.set(key, { kind: 'series', id: 'S' + hash(key), name: sname, cat, logo, seasons: {} });
      const s = seriesMap.get(key); const sn = m ? +m[2] : 1;
      (s.seasons[sn] = s.seasons[sn] || []).push({ kind: 'ep', id: 'E' + id, name: name, season: sn, ep: m ? +m[3] : s.seasons[sn].length + 1, url });
      if (!s.logo && logo) s.logo = logo;
    } else if (/\/movie\//i.test(url) || isFile) {
      vod.push({ kind: 'vod', id, name, cat, logo, url });
    } else {
      live.push({ kind: 'live', id, num: +e.a['tvg-chno'] || live.length + 1, name, cat, logo, epgId: e.a['tvg-id'] || '', url });
    }
  }
  const series = [...seriesMap.values()];
  series.forEach(s => Object.values(s.seasons).forEach(arr => arr.sort((a, b) => a.ep - b.ep)));
  return { live, vod, series, epgUrl: header['url-tvg'] || header['x-tvg-url'] || '' };
}

async function fetchT(url, ms = 30000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return r; }
  catch (e) {
    if (e.name === 'AbortError') throw new Error('O servidor demorou demais para responder. Tente de novo em instantes.');
    if (/HTTP 40[13]/.test(e.message)) throw new Error('O servidor recusou o acesso (' + e.message + '). Confira usuário e senha. Também acontece quando a assinatura venceu, quando todas as telas do plano estão em uso, ou quando o provedor bloqueia o download da lista M3U (nesse caso, use a aba Xtream Codes).');
    if (/^HTTP/.test(e.message)) throw new Error('O servidor respondeu com erro (' + e.message + '). Confira o endereço e os dados de acesso.');
    let msg = 'Não foi possível conectar ao servidor. Confira o endereço e sua conexão.';
    if (location.protocol === 'https:' && /^http:/i.test(url)) msg += ' Este endereço usa http, e páginas seguras (https) bloqueiam esse tipo de conexão.';
    if (/claude/i.test(location.hostname) || /claude/i.test(document.referrer)) msg += ' Na visualização do Claude, conexões a servidores externos ficam bloqueadas; use o modo de demonstração aqui ou abra o app fora daqui.';
    throw new Error(msg);
  } finally { clearTimeout(t); }
}
const normServer = (s) => { s = s.trim().replace(/\/+$/, '').replace(/\/player_api\.php.*$/i, ''); if (!/^https?:\/\//i.test(s)) s = 'http://' + s; return s; };
function xtUrl(pl, action, extra = '') { return `${pl.server}/player_api.php?username=${encodeURIComponent(pl.user)}&password=${encodeURIComponent(pl.pass)}${action ? '&action=' + action : ''}${extra}`; }
async function xt(pl, action, extra) { const r = await fetchT(xtUrl(pl, action, extra)); try { return await r.json(); } catch (e) { throw new Error('O servidor não respondeu no formato Xtream Codes. Confira o endereço.'); } }

/* ========= EPG ========= */
function epgFor(it) {
  if (!it || it.kind !== 'live') return null;
  if (S.data && S.data.demo) { if (!S.epg.has(it.id)) S.epg.set(it.id, demoEpg(it)); return S.epg.get(it.id); }
  const k = it.epgId || ('xt:' + it.id);
  if (S.epg.has(k)) return S.epg.get(k);
  const pl = activePl();
  if (pl && pl.type === 'xtream' && !S.epgPending.has(k)) {
    S.epgPending.add(k);
    xt(pl, 'get_short_epg', '&stream_id=' + it.id + '&limit=12').then(r => {
      const b64 = (s) => { try { return decodeURIComponent(escape(atob(s || ''))); } catch (e) { return s || ''; } };
      const list = (r && r.epg_listings || []).map(e => ({ start: (+e.start_timestamp || Date.parse(e.start)) * (e.start_timestamp ? 1000 : 1), end: (+e.stop_timestamp || Date.parse(e.end)) * (e.stop_timestamp ? 1000 : 1), title: b64(e.title), desc: b64(e.description) })).filter(e => e.end > Date.now() - 3600e3);
      S.epg.set(k, list); onEpg(it);
    }).catch(() => S.epg.set(k, []));
  }
  return null;
}
function nowNext(it) {
  const list = epgFor(it); if (!list || !list.length) return null;
  const t = Date.now(); const i = list.findIndex(p => p.start <= t && p.end > t);
  if (i < 0) return null;
  const cur = list[i]; return { cur, next: list[i + 1], pct: (t - cur.start) / (cur.end - cur.start) * 100, list, i };
}
async function loadXmltv(url) {
  if (!url || /\.gz(\?|$)/i.test(url)) return;
  try {
    const txt = await (await fetchT(url, 45000)).text();
    const doc = new DOMParser().parseFromString(txt, 'text/xml');
    const want = new Set(S.data.live.map(c => c.epgId).filter(Boolean));
    const now = Date.now();
    const pt = (s) => { const m = String(s).match(/(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)\s*([+-]\d{4})?/); if (!m) return 0; const z = m[7] ? m[7].slice(0, 3) + ':' + m[7].slice(3) : 'Z'; return Date.parse(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}${z}`); };
    const map = new Map();
    for (const p of doc.getElementsByTagName('programme')) {
      const ch = p.getAttribute('channel'); if (!want.has(ch)) continue;
      const end = pt(p.getAttribute('stop')); if (end < now - 3600e3 || end > now + 36 * 3600e3) continue;
      const g = (tag) => (p.getElementsByTagName(tag)[0] || {}).textContent || '';
      (map.get(ch) || map.set(ch, []).get(ch)).push({ start: pt(p.getAttribute('start')), end, title: g('title'), desc: g('desc') });
    }
    map.forEach((v, k) => { v.sort((a, b) => a.start - b.start); S.epg.set(k, v); });
    if (S.view === 'live' || S.view === 'home') render();
  } catch (e) { /* guia é opcional */ }
}

function lazyList(container, items, renderItem, batch = 80) {
  container.innerHTML = ''; let i = 0;
  if (container._io) container._io.disconnect();
  const sent = document.createElement('div'); sent.style.height = '1px'; container.appendChild(sent);
  const more = () => { if (i >= items.length) return; sent.insertAdjacentHTML('beforebegin', items.slice(i, i + batch).map(renderItem).join('')); i += batch; if (i >= items.length) { io.disconnect(); sent.remove(); } };

/* ========= Modais ========= */
let modalReturn = null;
function openModal(html, cls = 'sheet') {
  modalReturn = document.activeElement;
  const m = $('#modal'); m.innerHTML = `<div class="${cls}" role="dialog" aria-modal="true">${html}</div>`; m.classList.remove('hidden');
  setTimeout(() => { const f = m.querySelector('[data-autof]') || m.querySelector('[data-f]'); f && f.focus(); }, 30);
}
function closeModal() { const m = $('#modal'); m.classList.add('hidden'); m.innerHTML = ''; if (pinResolve) { pinResolve(false); pinResolve = null; } modalReturn && document.body.contains(modalReturn) && modalReturn.focus(); }
const modalOpen = () => !$('#modal').classList.contains('hidden');

let pinResolve = null, pinBuf = '', pinMode = 'check', pinNew = '';
function askPin(mode = 'check') {
  return new Promise(res => {
    pinResolve = res; pinBuf = ''; pinMode = mode; pinNew = '';
    openModal(`<div class="pin"><h2 id="pinT">${mode === 'check' ? 'Digite a senha' : 'Senha atual'}</h2><p class="muted small" id="pinS" style="margin:6px 0 0">${mode === 'check' ? 'Este conteúdo é protegido pelo controle dos pais.' : 'Confirme a senha atual para trocar.'}</p>
      <div class="dots" id="pinD">${'<i></i>'.repeat(4)}</div>
      <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-f data-pin="${n}">${n}</button>`).join('')}<button data-f data-pin="x" aria-label="Cancelar">${ic('x')}</button><button data-f data-pin="0" data-autof>0</button><button data-f data-pin="<" aria-label="Apagar">${ic('back')}</button></div></div>`, 'sheet');
  });
}
function pinKey(k) {
  if (k === 'x') return closeModal();
  if (k === '<') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 4) pinBuf += k;
  $$('#pinD i').forEach((d, i) => d.classList.toggle('f', i < pinBuf.length));
  if (pinBuf.length < 4) return;
  const fail = (msg) => { const d = $('#pinD'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); $('#pinS').textContent = msg; pinBuf = ''; setTimeout(() => $$('#pinD i').forEach(x => x.classList.remove('f')), 200); };
  setTimeout(() => {
    if (pinMode === 'check') { if (pinBuf === S.pin) { const r = pinResolve; pinResolve = null; closeModal(); S.unlocked = true; r(true); } else fail('Senha incorreta. Tente de novo.'); }
    else if (pinMode === 'change') { if (pinBuf === S.pin) { pinMode = 'new'; pinBuf = ''; $('#pinT').textContent = 'Nova senha'; $('#pinS').textContent = 'Escolha 4 números.'; $$('#pinD i').forEach(x => x.classList.remove('f')); } else fail('Senha incorreta. Tente de novo.'); }
    else if (pinMode === 'new') { pinNew = pinBuf; pinMode = 'confirm'; pinBuf = ''; $('#pinT').textContent = 'Repita a nova senha'; $('#pinS').textContent = 'Digite os mesmos 4 números.'; $$('#pinD i').forEach(x => x.classList.remove('f')); }
    else if (pinMode === 'confirm') { if (pinBuf === pinNew) { S.pin = pinNew; store.set('pin', S.pin); const r = pinResolve; pinResolve = null; closeModal(); toast('Senha alterada'); r(true); } else { pinMode = 'new'; $('#pinT').textContent = 'Nova senha'; fail('As senhas não conferem. Escolha de novo.'); } }
  }, 120);
}
async function guard(cat) { if (!locked(cat)) return true; return await askPin('check'); }

async function openDetail(key) {
  const it = itemByKey(key); if (!it) return;
  if (!(await guard(it.cat))) return;
  if (it.kind === 'live') return play(it);
  const pl = activePl();
  const body = () => {
    const fav = S.favs.has(key); const p = S.progress[key];
    let actions = '';
    if (it.kind === 'vod') actions = `<button class="btn primary" data-f data-play="${esc(key)}" data-autof>${ic('play')}${p ? 'Continuar de ' + fmtT(p.t) : 'Assistir'}</button>${p ? `<button class="btn" data-f data-play="${esc(key)}" data-fromstart>Do início</button>` : ''}`;
    else {
      const lastEp = Object.entries(S.progress).filter(([k]) => k.startsWith('ep:') && itemByKey(k) && itemByKey(k).parent === it).sort((a, b) => b[1].at - a[1].at)[0];
      const first = it.seasons && Object.values(it.seasons)[0] && Object.values(it.seasons)[0][0];
      const target = lastEp ? itemByKey(lastEp[0]) : first;
      if (target) actions = `<button class="btn primary" data-f data-play="${esc(keyOf(target))}" data-autof>${ic('play')}${lastEp ? `Continuar T${target.season} E${target.ep}` : 'Assistir T1 E1'}</button>`;
    }
    actions += `<button class="btn" data-f data-fav="${esc(key)}">${ic('star')}${fav ? 'Nos favoritos' : 'Favoritar'}</button>`;
    let eps = '';
    if (it.kind === 'series') {
      if (!it.seasons) eps = `<div class="muted" style="margin-top:16px">Carregando episódios…</div>`;
      else {
        const ss = Object.keys(it.seasons).sort((a, b) => a - b); const cur = it._season && it.seasons[it._season] ? it._season : ss[0];
        eps = `<div class="chips" style="margin-top:20px">${ss.map(s => `<button class="chip ${s == cur ? 'on' : ''}" data-f data-season="${s}">Temporada ${s}</button>`).join('')}</div>
        <div class="eps">${(it.seasons[cur] || []).map(e => { const pk = keyOf(e), pp = S.progress[pk]; return `<button class="ep" data-f data-play="${esc(pk)}"><span class="n">${e.ep}</span><span><b>${esc(e.title || e.name)}</b>${e.dur ? `<span class="muted small" style="display:block">${Math.round(e.dur / 60)} min</span>` : ''}${pp ? `<div class="prog"><i style="width:${(pp.t / pp.d * 100).toFixed(1)}%"></i></div>` : ''}</span>${ic('play')}</button>`; }).join('')}</div>`;
      }
    }
    const facts = [it.year && `<span><b>${esc(it.year)}</b></span>`, it.rating && `<span>★ <b>${esc(it.rating)}</b></span>`, it.dur && `<span>${Math.round(it.dur / 60)} min</span>`, `<span>${esc(it.cat)}</span>`, it.kind === 'series' && it.seasons && `<span>${Object.keys(it.seasons).length} temporada${Object.keys(it.seasons).length > 1 ? 's' : ''}</span>`].filter(Boolean).join('');
    return `<div class="detail"><div class="poster">${posterArt(it)}</div></div><div><div style="display:flex;justify-content:space-between;gap:10px"><h2>${esc(it.name)}</h2><button class="btn icon sm" data-f data-close aria-label="Fechar">${ic('x')}</button></div>
      <div class="facts">${facts}</div>${it.plot ? `<p class="plot">${esc(it.plot)}</p>` : ''}<div style="display:flex;gap:10px;flex-wrap:wrap">${actions}</div>${eps}</div></div>`;
  };
  it._render = () => { const sh = $('#modal .sheet'); if (sh) { sh.innerHTML = body(); const f = sh.querySelector('[data-autof]') || sh.querySelector('[data-f]'); f && f.focus(); } };
  openModal(body());
  if (pl && pl.type === 'xtream') {
    if (it.kind === 'vod' && !it._info) xt(pl, 'get_vod_info', '&vod_id=' + it.id).then(r => { it._info = 1; const i = r && r.info || {}; it.plot = it.plot || i.plot || i.description || ''; it.year = it.year || (i.releasedate || '').slice(0, 4); if (i.duration_secs) it.dur = +i.duration_secs; if (!modalOpen()) return; it._render(); }).catch(() => {});
    if (it.kind === 'series' && !it.seasons) xt(pl, 'get_series_info', '&series_id=' + it.id).then(r => {
      const seasons = {}; const e = r && r.episodes || {};
      Object.entries(e).forEach(([sn, arr]) => { seasons[sn] = (arr || []).map(x => { const ep = { kind: 'ep', id: String(x.id), name: x.title || ('Episódio ' + x.episode_num), title: x.title, season: +sn, ep: +x.episode_num, ext: x.container_extension || 'mp4', dur: x.info && +x.info.duration_secs || 0, parent: it }; S.index.set(keyOf(ep), ep); return ep; }).sort((a, b) => a.ep - b.ep); });
      it.seasons = seasons; if (r && r.info) { it.plot = it.plot || r.info.plot || ''; }
      if (modalOpen()) it._render();
    }).catch(() => { it.seasons = {}; if (modalOpen()) it._render(); });
  }
}
